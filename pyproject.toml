[project]
name = "ifremer-knowledge-base"
version = "0.1.0"
description = "Euro-Argo floats + OSO ontology in one Elasticsearch index, embedded for RAG, served via an HTTP API and an MCP server."
requires-python = ">=3.12"
dependencies = [
    "requests==2.34.2",
    "python-dotenv==1.2.3",
    "elasticsearch==8.19.3",
    "mcp==2.2.0",
]

[project.optional-dependencies]
api = [
    "torch",
    "sentence-transformers>=3.0",
    "rdflib",
    "pyshp",
    "shapely",
    "tqdm",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
